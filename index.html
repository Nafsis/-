<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>とけいの おべんきょう</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; font-family: 'Hiragino Maru Gothic ProN', sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; touch-action: none; }
  h1 { color: #333; font-size: 24px; }
  .time-display { font-size: 40px; font-weight: bold; background: white; padding: 10px 30px; border-radius: 15px; border: 4px solid #333; margin-bottom: 20px; color: #333; }
  .clock { width: 300px; height: 300px; border: 15px solid #ffb6c1; border-radius: 50%; position: relative; background: white; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
  .center { width: 20px; height: 20px; background: #333; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
  .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 10px; cursor: pointer; }
  .hour-hand { width: 14px; height: 80px; background: #ff4500; margin-left: -7px; z-index: 2; pointer-events: none; }
  .minute-hand { width: 10px; height: 125px; background: #1e90ff; margin-left: -5px; z-index: 1; }
  .number { position: absolute; font-size: 28px; font-weight: bold; color: #333; transform: translate(-50%, -50%); pointer-events: none; }
  .controls { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  button { font-size: 20px; font-weight: bold; padding: 15px 25px; border-radius: 12px; border: none; background: #32cd32; color: white; cursor: pointer; box-shadow: 0 4px 0 #228b22; transition: transform 0.1s; }
  button:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>

<div class="time-display" id="time">12じ 0ふん</div>
<div class="clock" id="clock">
  <div class="center"></div>
  <div class="hand hour-hand" id="hour"></div>
  <div class="hand minute-hand" id="minute"></div>
</div>
<div class="controls">

</div>

<script>
  const clock = document.getElementById('clock');
  const hourHand = document.getElementById('hour');
  const minuteHand = document.getElementById('minute');
  const timeDisplay = document.getElementById('time');

  let minutes = 0; // 12:00を基準とした合計分数

  // 文字盤の数字を配置
  for (let i = 1; i <= 12; i++) {
    const num = document.createElement('div');
    num.className = 'number';
    num.innerText = i;
    const angle = i * 30 * (Math.PI / 180);
    const radius = 115;
    const x = 150 + radius * Math.sin(angle);
    const y = 150 - radius * Math.cos(angle);
    num.style.left = `${x}px`;
    num.style.top = `${y}px`;
    clock.appendChild(num);
  }

  function updateClock() {
    let h = Math.floor(minutes / 60) % 12;
    if (h === 0) h = 12;
    let m = minutes % 60;
    
    const minuteAngle = m * 6;
    const hourAngle = (h * 30) + (m * 0.5);

    minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
    hourHand.style.transform = `rotate(${hourAngle}deg)`;

    timeDisplay.innerText = `${h}じ ${m}ふん`;
  }

  function addMinutes(mins) {
    minutes += mins;
    updateClock();
  }

  // 指で分針を回すための処理
  let isDragging = false;
  let rect = clock.getBoundingClientRect();

  minuteHand.addEventListener('pointerdown', (e) => {
    isDragging = true;
    rect = clock.getBoundingClientRect();
    e.preventDefault();
  });

  document.addEventListener('pointerup', () => {
    isDragging = false;
  });

  document.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const x = e.clientX - centerX;
    const y = centerY - e.clientY; 
    
    let angle = Math.atan2(x, y) * (180 / Math.PI);
    if (angle < 0) angle += 360;
    
    let currentMins = Math.round(angle / 6);
    if (currentMins === 60) currentMins = 0;
    
    let currentM = minutes % 60;
    let diff = currentMins - currentM;
    
    if (diff < -30) diff += 60;
    if (diff > 30) diff -= 60;
    
    minutes += diff;
    if (minutes < 0) minutes += 720; 
    
    updateClock();
  });

  updateClock();
</script>
</body>
</html>
